blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/HiImSmiley/Socketley/security/advisories/new
    about: >
      Report privately. Please do not open a public issue for a security problem.
  - name: Question or usage help
    url: https://github.com/HiImSmiley/Socketley/discussions
    about: >
      Ask here rather than opening an issue. Check `man socketley` first — it
      documents every flag.
