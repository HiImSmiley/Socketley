name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Not liburing-dev: ubuntu-24.04 has 2.5 and this tree needs >= 2.7.
          # A tagged release built against 2.5 does not exist — the build stops
          # at event_loop.cpp — so every tag pushed since 2026-07-28 failed here.
          sudo apt-get install -y build-essential libssl-dev cmake \
            netcat-openbsd bc libluajit-5.1-dev

      - name: Vendored static archives
        run: bash bin/build-thirdparty.sh luajit && bash bin/build-thirdparty.sh http3

      - name: Install liburing
        run: bash scripts/install-liburing.sh

      - name: Build release binary
        run: |
          ./bin/premake5 gmake2
          cd make && make config=release_x64 -j$(nproc)

      - name: Run tests
        run: |
          ./bin/Release/test_command_hashing
          ./bin/Release/test_cache_store
          ./bin/Release/test_resp_parser
          ./bin/Release/test_name_resolver
          ./bin/Release/test_ws_parser
          bash test/ci/assert_suite.sh suite-release.log
        # 5 was right when it was written: the release job passed for v1.0.6
        # through v1.0.9 in about 3m50s each.  The suite has grown since -- its
        # own header says 141 sections and there are 162 now, ~32 minutes on a
        # 16-core box -- so the step this guards would be killed mid-suite, and
        # every tag pushed would fail here.  Nothing caught it because no tag has
        # been pushed since v1.0.9 in March.
        #
        # 45 rather than a guess: nightly.yml gives run_all.sh 35 on this same
        # runner and has been living with it.
        #
        # And assert_suite.sh rather than run_all.sh directly, for the reason
        # that wrapper exists: run_all.sh exits 0 when it ran nothing at all, so
        # a missing binary or a daemon that never came up would have shipped a
        # release with a green check mark.  ci.yml has gone through the wrapper
        # for exactly this since it was written; the release job never did.
        timeout-minutes: 45

      - name: Build .deb package
        run: bash packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Socketley $VERSION" \
            --generate-notes \
            "socketley_${VERSION}_amd64.deb"
