# Nightly — the expensive half of the pipeline.
#
# Everything here is too slow to run on a push: sanitized builds, a long fuzz
# campaign with corpus carry-over, load harnesses that idle 60 s between passes
# by design, and a Release LTO build.  Split into independent jobs so one slow
# job does not hide another's result and so a failure names its own area.
#
# ┌───────────────────┬────────────────────────────────────────────────────────┐
# │ sanitizers        │ ASan+UBSan build, unit + integration suite             │
# │ fuzz              │ long fuzz run, all nine targets, corpus carry-over     │
# │ invariants        │ -DSOCKETLEY_INVARIANTS -DSOCKETLEY_INVARIANTS_WARN_ONLY│
# │                   │ suite + the fast load harnesses                        │
# │ load              │ Release build, the calibrated measurement harnesses    │
# │ tsan              │ TSan build + suite.  Expected to be quiet.             │
# │ release-lto       │ compile-only smoke of the Release/LTO configuration    │
# └───────────────────┴────────────────────────────────────────────────────────┘
#
# ─── WHAT THE NIGHTLY DOES NOT COVER ────────────────────────────────────────
#
#   * multi-machine anything: clustering across hosts, real DNS, real TLS peers.
#   * kernel variation.  One runner image, one io_uring feature set.  Paths
#     gated on newer opcodes may never execute here.
#   * memory pressure.  The development machine has 3 GB and no swap and has
#     produced defects that a runner with 16 GB will not reach.
#   * timing comparability across runs.  GitHub runners are shared hardware;
#     the load harnesses' own preflight reports when a batch started dirty, but
#     it cannot make a noisy neighbour go away.  Treat a single bad nightly as a
#     signal to re-run, and a run of bad nightlies as a defect.
#   * proof of absence.  Several of the defects these harnesses were written for
#     reproduced in one run out of forty.
#   * MemorySanitizer.  Absent on purpose.  MSan reports a false positive for
#     every byte that reaches it through code it did not instrument, so it is
#     only usable with an instrumented libc++ *and* instrumented liburing,
#     OpenSSL and LuaJIT — and LuaJIT is hand-written assembly that MSan cannot
#     instrument at all.  Standing that stack up is a project in itself, and
#     adding -fsanitize=memory without it produces noise that ends with the
#     sanitizer being switched off entirely.  ASan+UBSan (here and in the fuzz
#     job) plus TSan is the set that actually holds.  Reads of uninitialised
#     memory are therefore NOT covered by this pipeline.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Seconds per fuzz target'
        required: false
        default: '600'

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # liburing is deliberately absent from this list.  ubuntu-24.04 packages 2.5,
  # this tree has needed >= 2.7 since 6c5c110 (2026-07-28), and every job below
  # installed 2.5 and then failed to build — the Nightly was red from that day
  # until 2026-08-01.  Each job runs scripts/install-liburing.sh instead, which
  # is also what the Dockerfile, CI and the release job use.
  APT_PACKAGES: >-
    build-essential libssl-dev netcat-openbsd bc libluajit-5.1-dev

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # ASan + UBSan over the whole suite.  This is the job that would have caught
  # the memory-lifetime defects this project keeps finding by hand: a completion
  # dispatched into a reused struct, a view into a buffer that has been
  # returned.  UBSan is built with -fno-sanitize-recover=all so a finding aborts
  # rather than printing and continuing.
  # ───────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: ASan + UBSan suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      - name: Build (Sanitize)
        run: |
          ./bin/premake5 gmake2
          cd make && make config=sanitize_x64 -j"$(nproc)"

      - name: Verify the build
        run: |
          for b in socketley test_command_hashing test_cache_store test_resp_parser \
                   test_name_resolver test_ws_parser; do
            test -x "bin/Sanitize/$b" || { echo "missing bin/Sanitize/$b"; exit 1; }
          done
          # Prove the binary is actually instrumented.  A Sanitize build that
          # silently lost its flags runs the whole suite and finds nothing,
          # which looks exactly like a clean run.
          if ! nm -C bin/Sanitize/socketley 2>/dev/null | grep -q '__asan_'; then
            echo "bin/Sanitize/socketley has no ASan symbols — it was not built with sanitizers."
            exit 1
          fi
          echo "ASan symbols present."

      - name: Integration suite (sanitized)
        env:
          SOCKETLEY_CONFIG: Sanitize
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:log_path=stderr:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash test/ci/assert_suite.sh suite-sanitize.log
        timeout-minutes: 40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-sanitize-log
          path: suite-sanitize.log
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # The long fuzz run.  All five targets, ASan+UBSan, with the *working* corpus
  # carried over from the previous night through the actions cache so each run
  # starts where the last one stopped rather than from the seeds every time.
  #
  # The cache holds bin/fuzz-corpus, not test/fuzz/corpus.  libFuzzer writes what
  # it discovers into the first corpus directory it is given, and that used to be
  # the tracked seed directory — which is how test/fuzz/corpus/cache reached 6783
  # committed files that nobody had read.  run_fuzz.sh now passes a working
  # directory first and the seeds second (read-only), so the growth happens under
  # bin/ and the repository keeps only what make_corpus.py generates.
  #
  # This job also builds the libFuzzer versions when clang can produce them.
  # The GCC replay driver always runs; libFuzzer runs on top when available.
  # ───────────────────────────────────────────────────────────────────────────
  fuzz:
    name: Long fuzz run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang is required in this job: libFuzzer is the primary fuzzing
          # path and REQUIRE_LIBFUZZER=1 below will fail without it.  It remains
          # a testing toolchain — socketley itself is built by GCC, here and
          # everywhere else.  No `||` fallback: a missing clang must fail here,
          # where the error names the cause.
          sudo apt-get install -y $APT_PACKAGES clang-18 libclang-rt-18-dev
          clang++-18 --version
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      # Carry-over.  The key rotates per run so each night writes a new entry;
      # restore-keys falls back to the most recent one, which is what makes the
      # corpus grow instead of resetting.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: bin/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Seed corpus
        # Always regenerated on top of whatever was restored: a cache that came
        # back empty or corrupt must not turn into a fuzz run over nothing.
        run: |
          python3 test/fuzz/make_corpus.py
          total=0
          for d in resp ws http httpresp cache server client proxy; do
            n=$(find "test/fuzz/corpus/$d" -type f | wc -l)
            echo "corpus/$d: $n files"
            [ "$n" -gt 0 ] || { echo "corpus/$d is empty"; exit 1; }
            total=$((total + n))
          done
          echo "total corpus: $total files"
          [ "$total" -ge 100 ] || { echo "corpus is implausibly small ($total) — refusing to call this a fuzz run"; exit 1; }
          # And the working corpus, which is what actually grows.  Empty on the
          # first run after this changed, and never empty again.
          find bin/fuzz-corpus -type f 2>/dev/null | wc -l | xargs echo "carried-over working corpus:"

      - name: Build fuzz targets (GCC, ASan+UBSan)
        # All nine.  This list is the one run_fuzz.sh defaults to and it has to
        # stay that way: the script runs each target twice, libFuzzer then the
        # GCC replay driver, and a target whose replay binary is missing is a
        # failure, not a skip.  fuzz_event_loop was added to run_fuzz.sh in
        # 3a7052c and never added here, so every run of this job since has ended
        # with
        #     FAIL fuzz_event_loop: bin/Sanitize/fuzz_event_loop does not exist
        # and would have exited 1 on that alone.  Nobody saw it because the job
        # has not reached the end of the target list since 2026-07-28.
        run: |
          ./bin/premake5 gmake2
          cd make && make config=sanitize_x64 -j"$(nproc)" fuzz_resp fuzz_ws_frame fuzz_cache_ops fuzz_http_response fuzz_event_loop fuzz_http_request fuzz_server_ops fuzz_client_ops fuzz_proxy_ops
          cd ..
          for b in fuzz_resp fuzz_ws_frame fuzz_cache_ops fuzz_http_response fuzz_event_loop fuzz_http_request fuzz_server_ops fuzz_client_ops fuzz_proxy_ops; do
            test -x "bin/Sanitize/$b" || { echo "$b was not built"; exit 1; }
          done

      - name: Build fuzz targets (clang + libFuzzer)
        # The primary path, and required here.  This used to be
        # continue-on-error because the machine it was written on had no clang;
        # ubuntu-24.04 ships clang-18 and libclang-rt-18-dev, so a failure to
        # build libFuzzer now means a real breakage, not an absent toolchain.
        #
        # Every target, including the four that compile the fifteen SDK
        # translation units with clang because they cannot link premake's
        # GCC/ASan archive (one process, one sanitizer runtime):
        # fuzz_http_request, and the three operation-sequence targets
        # fuzz_server_ops, fuzz_client_ops and fuzz_proxy_ops, which drive a
        # real server_instance, client_instance and proxy_instance against a
        # real io_uring loop.  That is the expensive part of this job and the
        # reason it is nightly.
        #
        # BUDGET.  run_fuzz.sh spends the per-target budget twice — libFuzzer
        # then the replay driver — so the wall clock is 2 x targets x seconds.
        # At the 600 s default that is already past timeout-minutes below with
        # the targets that were here before these two; lower fuzz_seconds, or
        # raise the timeout, rather than dropping a target.
        env:
          REQUIRE_LIBFUZZER: "1"
        run: bash test/fuzz/build_libfuzzer.sh

      - name: Long fuzz run
        # Coverage-guided first, replay driver second, per target — so the
        # budget below is spent twice per target.  libFuzzer writes the inputs
        # it discovers back into test/fuzz/corpus/<name>, which is what the
        # cache save step below carries into tomorrow's run: the corpus grows
        # instead of resetting to the 118 seeds every night.
        #
        # REQUIRE_LIBFUZZER=1 here as well as at build time.  The build step
        # proves the binaries were produced; this proves they were actually run.
        #
        # CLOSED 2026-07-31 (commit 5061394): fuzz_http_request used to fail
        # immediately, on a seed.  Two findings in
        # proxy_instance::parse_http_request_line, both of them reachable from
        # the network by an unauthenticated client:
        #
        #   1. A length underflow in the header-block string_view.  `pos` is the
        #      first "\r\n" and `hdr_end` the first "\r\n\r\n"; when a request
        #      carries no headers those are the same offset, so `hdr_end-pos-2`
        #      wrapped to SIZE_MAX-1 and the header scan read off the heap.
        #      `GET / HTTP/1.1\r\n\r\n` — 18 legal bytes — was enough.
        #      Seeds: http/no_headers, http/no_headers_10.
        #   2. The CL+TE smuggling check split headers on CRLF only, so two
        #      headers separated by a bare LF read as one line to the proxy and
        #      as two to a backend, and the request was forwarded.
        #      Seed: http/cl_te_lf_first.
        #
        # The seeds stay.  Do NOT drop the target or set FUZZ_SMUGGLING=0 — the
        # only thing keeping those two fixed is this job running them nightly.
        #
        # CLOSED 2026-07-31: fuzz_http_response used to fail on its first run.
        # This target was written on the day the response framing was lifted out
        # of handle_backend_read, and it raised everything below within two
        # million executions; all eight were fixed the same week in
        # http_response_framing.h, and the fixed parser then ran 4.9 million
        # executions with nothing new.  Each id is a RESP_FINDING in
        # test/fuzz/fuzz_http_response.cpp, and each one ended the same way: a
        # backend socket returned to the pool at an offset that is not a message
        # boundary, so the next client to borrow it read the tail of a stranger's
        # response as the head of its own.  What they were, and what the fix was:
        #
        #   pool-eol / pool-no-headers / pool-no-boundary / pool-1xx-chain
        #     One defect under four ids.  The 1xx branch of the scan cleared
        #     response_bytes_seen, which re-armed the assumption that the next
        #     read begins a response.  It does not, when the backend flushed the
        #     interim 1xx together with the head of the real response: the rest of
        #     that header block arrived in the following read and was parsed as a
        #     whole response, so the first surviving header line became the
        #     status line and everything before the read boundary — the real
        #     status, a Transfer-Encoding, a Connection: close — was invisible.
        #     That is precisely the defect response_bytes_seen was added to
        #     prevent, reintroduced by the reset.  Reproduced without the fuzzer:
        #       read 1: "HTTP/1.1 100 Continue\r\n\r\n"
        #               "HTTP/1.1 200 OK\r\nTransfer-Encoding: chunked\r\n"
        #       read 2: "Content-Length: 5\r\n\r\n5\r\nHELLO\r\n0\r\n\r\n"
        #     gave headers_parsed, chunked=false, Content-Length=5, and the
        #     socket declared poolable with the chunked terminator still on it.
        #     FIX: the scan walks forward through interim blocks inside the chunk
        #     it was given instead of handing the problem to the next one.  The
        #     flag is cleared only when an interim block ends exactly on the read
        #     boundary — the one case where the next chunk really does begin a
        #     response — and anything left over behind a 1xx makes the framing
        #     unknown.  A stream of nothing but interim blocks (eight, matching
        #     the reference framer) is unknown too.
        #
        #   pool-te
        #     The Transfer-Encoding test was `size >= 7 && val[0..1] == "ch"` over
        #     a value trimmed of spaces only.  "Transfer-Encoding:\tchunked" (a
        #     tab), "identity" and "gzip" therefore all read as no transfer
        #     coding, and with a Content-Length also present the response was
        #     framed by that length — while the body is chunked, or runs to
        #     connection close.  RFC 9112 Section 6.1: any transfer coding makes
        #     Content-Length inoperative.
        #     FIX: values are trimmed of tabs as well as spaces and read as the
        #     comma-separated lists they are, and *any* non-empty
        #     Transfer-Encoding now blocks pooling, not only a chunked one.
        #     Seeds: httpresp/te_tab_value, cl_te_identity, cl_te_gzip.
        #
        #   pool-cl-bad
        #     std::from_chars succeeds on a partial parse, so "Content-Length: 3x"
        #     yielded 3; two Content-Lengths that disagree silently resolved to
        #     the last one.  RFC 9112 Section 6.3 requires both to be treated as
        #     unrecoverable.
        #     FIX: the value must be a whole decimal field with no trailing bytes
        #     and no overflow, and a second Content-Length that disagrees with the
        #     first makes the framing unknown instead of overwriting it.
        #     Seeds: httpresp/cl_trailing_junk, cl_twice_diff.
        #
        #   pool-name-ws / pool-obs-fold
        #     The two header-block shapes RFC 9112 requires a recipient to refuse
        #     rather than interpret: whitespace between a field name and its colon
        #     (Section 5.1), and obsolete line folding (Section 5.2).  This proxy
        #     interpreted both, differently from a lenient backend, and pooled.
        #     Lower severity than the four above — they need an unusual backend
        #     rather than a common one — but the same failure.
        #     FIX: either shape makes the framing unknown.
        #     Seeds: httpresp/cl_space_before_colon, obs_fold_te.
        #
        # Two more were printed as observations rather than failures, because the
        # cost was a failed request rather than crossed data, and both are fixed
        # as well: a Connection: close that is not the first token in its list was
        # missed ("keep-alive, close"), now found by the same list parser as
        # above; and a response with no readable status code was framed by
        # Content-Length although 1xx/204/304 could not be ruled out — the status
        # line is now required to be "HTTP/x.y NNN" with the code delimited, and
        # anything else is unknown.
        #
        # A ninth was found by the fixed parser and fixed with it: the walk over
        # interim blocks skipped their headers entirely, so a 1xx carrying
        # "Content-Length: HTTP/1.1 100 Continue" let the response behind it be
        # framed and pooled as though the backend had been perfectly clear.  Every
        # block's headers are checked for shape now; only the final block's values
        # are used.
        #
        # Do NOT set FUZZ_HTTPRESP_SKIP here.  If one of these reopens, the skip
        # goes in the per-push job so that it keeps catching new regressions;
        # this job is the record, and the record must stay honest.
        #
        # fuzz_cache_ops has no open findings.  FUZZ_CACHE_SKIP is deliberately
        # NOT set here — the per-push job is where it would go if one reopened;
        # this one is the record of what is open, and the record is empty.  Each
        # id below is a CACHE_FINDING in test/fuzz/fuzz_cache_ops.cpp:
        #
        #   expire-over-limit
        #     Closed 2026-07-31, in the harness rather than in the store: the
        #     expectation was wrong.  EXPIRE is not a denyoom command — a
        #     command whose purpose is to let data expire must not fail because
        #     there is too much data, and setting a TTL is how a caller reduces
        #     pressure in the first place.  The check now allows an EXPIRE to
        #     carry usage past maxmemory by the one m_expiry node it adds, and
        #     by nothing else; the reasoning is written out at OP_EXPIRE.
        #
        #   uaf-collection-evict / refused-write-destroys-key /
        #   append-self-evict / failed-set-drops-ttl / over-limit
        #     Fixed 2026-07-31.  The first three were one defect wearing three
        #     faces: try_evict was free to choose the very key the write in
        #     progress named, so the collection writers wrote through a freed
        #     node, a refused write had already destroyed the value it refused
        #     to replace, and APPEND recreated its key holding only the suffix.
        #     check_memory() now takes the key being written and try_evict()
        #     will not take it.  failed-set-drops-ttl: set() dropped the expiry
        #     before the checks that can refuse, so a refusal stripped a TTL off
        #     a key it never wrote; it drops it at the point the write is going
        #     ahead now.  over-limit: three rewrite paths (SET, HSET over an
        #     existing field, APPEND) asked for what the resulting *length*
        #     needs, while libstdc++ reallocates to twice the old capacity —
        #     rewritten_string() is what they ask for now, and HSET over an
        #     existing field asked for nothing at all.  The seeds that found
        #     them are in test/fuzz/corpus/cache and stay there.
        #
        #   load-usage / mem-floor / mem-baseline / lru-order / key-vanished /
        #   write-vanished / write-refused
        #     Not currently firing.  They are the checks for the defects already
        #     fixed by hand (the orphaned LRU node, the accounting that read 11x
        #     low, the refusal reported as a success); they are here so those
        #     stay fixed.
        #
        # fuzz_proxy_ops: all four findings this target raised against the tree
        # on 2026-08-01 are fixed, and FUZZ_PROXY_SKIP is empty for that reason.
        # Each seed stays in test/fuzz/corpus/proxy, so each defect has a check
        # that would catch it coming back — which is the whole reason an id
        # comes off this list the day its defect goes rather than being left
        # behind to silence it.  What each one was, in the order they were found:
        #
        #   answer-lost-to-a-half-close — FIXED, and off this list with the fix.
        #     handle_client_read stated its two end-of-stream guards inside the
        #     global rate limit branch, where res is positive by construction,
        #     so neither could ever run; they are stated once now, in the block
        #     that actually sees a zero-length completion.  A client that
        #     half-closes after a whole request is held for its answer while the
        #     pair is still reachable, and closed after it.  Seed:
        #     proxy/client_fin_after_a_whole_request, which now runs clean and
        #     fails again the moment either guard is put back where it was.
        #
        #   crosstalk
        #     Fixed 2026-08-01, and off this list for that reason.  The liveness
        #     probe in acquire_pooled_backend treated "data is waiting" as
        #     healthy, against its own comment, so a socket a backend had
        #     written on while it sat idle was handed to the next request and
        #     the stale answer became the head of that client's response.  A
        #     readable pooled socket is destroyed now rather than reused:
        #     nothing was asked of it, so a byte on it is a byte nobody asked
        #     for.  Its seed, proxy/pooled_socket_speaks_unbidden, stays in the
        #     corpus.
        #     Re-adjudicated 2026-08-01 against a claim that this was never
        #     fixed, and the claim does not survive a trace.  The seed drives
        #     acquire_pooled_backend's probe to r=1 and through the destroy
        #     branch; the borrower then dials a fresh socket and reads its own
        #     answer.  That is the signature of the defect and the signature of
        #     the fix, and it is what tells this apart from the artefact below,
        #     which reaches the same finding with the probe correctly returning
        #     EAGAIN.  If this id fires again, read the probe's result first:
        #     r>0 is the defect back, EAGAIN is the harness.
        #
        #   pool-off-boundary
        #     Fixed 2026-08-01, and off this list for that reason.
        #     http_response_scan_chunk counted a declared body down to zero and
        #     dropped the excess without setting `unknown`, so a backend that
        #     flushed a whole response and the head of a second one in one write
        #     got its socket filed in the pool mid-message.  Bytes past the
        #     declared end set `unknown` now wherever in the stream of
        #     completions they arrive, which is what finish_pool_drain already
        #     concluded for the later ones.  Its seed,
        #     proxy/response_with_a_tail, stays in the corpus.
        #
        # WAS RED ON MUTATION AND NOT FOR A DEFECT — three of the four are now
        # closed in the harness, and the entries stay because what was wrong
        # with them is the part worth keeping.  The whole seed corpus replayed
        # clean with nothing demoted; blind mutation past it did not, and what
        # it reached were four shapes where an oracle stated its claim at a
        # moment the harness's *own* bookkeeping had already moved past.  None
        # was ever demoted — a demoted id silences the real defect that shares
        # its name — so the fix in each case was to state the claim at the
        # moment it is true, which is narrower than the old form and not
        # quieter.  Every one of them was re-checked against the defect it
        # exists for, by putting that defect back; those runs are in the commit.
        #
        #   * pool-off-boundary — CLOSED 2026-08-01, in the harness.  The
        #     backend starts a *new* message on a socket the proxy had already
        #     filed correctly at a boundary, and the finding's own words — "was
        #     filed in the pool somewhere other than a message boundary" — were
        #     not what happened: the filing was right and the state changed
        #     afterwards.  The proxy could not notice either, because noticing
        #     needs an operation armed on a pooled socket and the pooled-fd-armed
        #     check in the same file forbids exactly that by name; the two
        #     invariants could not both be satisfied as written.  In a trace,
        #     and it was rediscovered three times: release_to_pool files the
        #     socket in one step with the harness's resp_pending false, and a
        #     later OP_BE_RESPOND of A_HEAD_SPLIT on that same socket flips
        #     resp_pending true, at which point the per-step
        #     check_backend_pool() walk reported it.  The order of those two
        #     lines was the whole diagnosis, and it is now the whole check:
        #     check_backend_pool() reports at filing time — the first walk that
        #     sees a socket in the pool which was not in it before — so what a
        #     backend does to an already-filed socket is no longer charged to
        #     the filing.  Reverting efdbabd's `unknown` past a bounded end
        #     brings the finding straight back on proxy/response_with_a_tail.
        #   * crosstalk — CLOSED 2026-08-01, in the harness.  The harness backend
        #     answered an unread request late, on a socket that had since been
        #     reused, so the mark on the wire was its own bookkeeping rather than
        #     a misrouted response.  A proxy pairs answers to requests
        #     positionally, which is all HTTP/1.1 gives it, and both pairings
        #     were right.  Traced end to end, because it was mistaken for the
        #     fixed defect returning: BE_SERVE accepts the proxy's connection in
        #     the same step the proxy is still writing the request into it, so
        #     the harness's read finds nothing and the socket's owed queue stays
        #     empty.  A later A_UNSOLICITED on that socket is therefore built
        #     with id 0 — no X-Fuzz-Ack at all — and it is, on the wire, the only
        #     answer to the one request the proxy has outstanding there.  The
        #     proxy forwards it to the client that asked and pools the socket,
        #     both correct.  The probe returns EAGAIN when the next client
        #     borrows it, and that is the truth: nothing is waiting at the
        #     proxy's end.  The desync was at the *backend's* end, where the
        #     first request still sat unread; the harness then read both requests
        #     in one go and answered the older one, stamping it with an id whose
        #     client had let go of that socket two steps earlier.
        #     bsock_respond() now records how far the wire had run whenever it
        #     answers something this end has not read, and bsock_note_request()
        #     does not add a request from behind that mark to owed[] — it has
        #     been answered already.  An answer written over an unread request
        #     also goes out unmarked, because an older id on it is a mismatch
        #     this end invented.  Neither touches the case the defect is in: an
        #     answer volunteered onto a genuinely quiet socket still carries
        #     last_id, so reverting ed07f12's destroy-on-readable branch brings
        #     crosstalk straight back on proxy/pooled_socket_speaks_unbidden.
        #     THE DISCRIMINATOR, if this id fires again: read the probe's result
        #     first.  r>0 is the defect back.  EAGAIN is the harness.
        #   * request-on-unfinished-socket — STILL OPEN, and the one of the four
        #     not touched here.  The harness reads a request that arrived
        #     *before* its unfinished response was written, and notes it at read
        #     time rather than at arrival time.  Same shape as the two above and
        #     the same kind of fix is available; it is left alone rather than
        #     changed untested.  Reached in about 25 s of blind mutation from the
        #     seeds, on this tree and identically on the tree before the three
        #     fixes above, so it is neither new nor caused by them.
        #   * client-closed-without-answer, in the shape where the client was
        #     answered and then wrote again — CLOSED 2026-08-01, in the harness.
        #     The proxy answers 408 or 504 with Connection: close, the client
        #     reads all 87 bytes of it, and the program's next OP_REQUEST puts
        #     another request into a connection the proxy has already said it is
        #     ending.  client_send() counted that request and set rx_since_req
        #     back to 0 — which is right for a keep-alive client, whose second
        #     request must be judged on its own bytes, and wrong here, because it
        #     erased the only record that the first one was answered.  The report
        #     then read "sent N complete request(s) and received 0 bytes" against
        #     a wire that had plainly carried an answer.  Reached from three
        #     directions: the deadline sweep's 408, its 504, and a backend
        #     response carrying Connection: close that the proxy forwarded.
        #     client_send() still writes those bytes — the proxy has to survive
        #     receiving them — and no longer counts them: a connection the proxy
        #     has announced the end of is owed nothing further, which is also
        #     what RFC 9112 Section 9.6 says of a client that keeps sending on
        #     one.  The report now carries the connection total beside the
        #     since-the-request count, so the claim can be checked against the
        #     wire instead of contradicting it.
        #     This was NEVER the undiagnosed shape below — there nothing at all
        #     is written to the client, here a whole answer is — and the two are
        #     now told apart by the report itself: the undiagnosed one reads
        #     "0 bytes in total on this connection".
        #
        # AND ONE THAT IS NOT DIAGNOSED, so do not assume it belongs in the list
        # above.  client-closed-without-answer, in the shape WITHOUT a
        # half-close: the client is torn down with nothing written to it at all.
        # Reached by mutation and confirmed to fire identically on an unmodified
        # build, so it predates the 2026-08-01 fixes and none of them caused it.
        # It is the same id 84d624c and 984dadc were written for, in the
        # error-answer path rather than the deadline or the pool, and whether
        # the proxy owes a 502 there has not been settled.  It is untouched by
        # the harness fix above, which only ever declines to count a request
        # written after a Connection: close the client has read: here there is
        # no response, so there is no announcement, so the ledger is not frozen
        # and the finding stands.  Read the total in the report to tell them
        # apart — this one says "0 bytes in total on this connection".
        # Not demoted: an id demoted for an undiagnosed shape silences every
        # other shape it covers, and this id covers the loss those two commits
        # fixed.
        #
        # A THIRD SHAPE UNDER THE SAME ID, found while the above was being
        # checked and left standing on purpose.  The backend answers with no
        # status line, the proxy forwards 37 bytes of it to the client, the
        # backend half-closes, and the client — never told the connection was
        # ending, because nothing the proxy sent said so — asks again and is
        # closed in silence.  It fires identically before and after the harness
        # change.  Either the proxy owes an answer to the second request or it
        # owes a Connection: close on the first; the report reads "received 0
        # bytes ... (37 bytes in total on this connection)", which is now exactly
        # what happened.  Not diagnosed further here.
        #
        # And one more, which FUZZ_PROXY_SKIP cannot reach, because it is not
        # one of the harness's checks: it is socketley/shared/invariants.h
        # aborting on its own account, and SKL_INV_PAIR has no id and no
        # demotion.  Seed: proxy/found-55a07a18, 32 bytes, both legs over TLS.
        #
        #     [invariant] nothing in flight on either half — this pair will
        #     never be woken again | at proxy::on_cqe
        #     | a: fd=-1 present=0 queued=0 closing=0
        #     | b: fd=11 present=1 queued=1 closing=1
        #
        # FIXED.  close_pair deferred a teardown on the strength of what the
        # flush returned rather than on whether anything had actually reached
        # the ring: on a TLS leg whose handshake never finished, tls_flush holds
        # the application data back and reports success, so the pair was left
        # closing with a queue that nothing would ever drain.  The deferral is
        # now conditional on a completion really being owed — the same predicate
        # the invariant asserts — so a queue that can no longer drain is torn
        # down instead of held.  There is nothing to demote here and there never
        # was: -DSOCKETLEY_INVARIANTS_WARN_ONLY is the only lever that exists,
        # it would take the same assertions out of fuzz_server_ops and
        # fuzz_client_ops with it, and it stays deliberately unset.
        #
        # ─── THE PROXY CONFIGURATION MATRIX ─────────────────────────────────
        #
        # Added 2026-08-01.  Every seed in test/fuzz/corpus/proxy starts from
        # the default proxy configuration — only the operation stream differs —
        # so 64 seeds are 64 programs against one proxy, and a defect that lives
        # in another configuration is invisible to all of them however long they
        # are mutated.  6de09db is that defect: a half-closed client losing its
        # answer on --backend-timeout 0, where the predicate deciding whether an
        # answer was owed rested on a flag arm_response_deadline() never sets
        # when the deadline is off, and with no deadline there is no sweep to
        # answer 502/504 in its place.  proxy/client_fin_after_a_whole_request —
        # the seed for exactly that loss — replays clean on a build with the
        # predicate broken.  It was found by hand-editing the target.
        #
        # run_fuzz.sh now replays the proxy seed corpus once more per pinned
        # configuration: FUZZ_PROXY_CONFIG builds every instance with the values
        # and refuses OP_CONFIG for them, so the input cannot leave the
        # configuration the entry is about.  Three entries, chosen on one rule —
        # a setting whose disabling value removes a guarantee, and which is on
        # by default so the corpus has never run without it:
        # backend-timeout=0, circuit-threshold=0, and both together.  retries,
        # max-connections and idle-timeout all default to 0, so the corpus
        # already runs with them off on every seed.
        #
        # Measured: with the predicate of 6de09db put back as it was, the
        # default run stays green and the backend-timeout=0 entry fails on
        # proxy/client_fin_after_a_whole_request.  That is the whole point of
        # the entry, and it is why FUZZ_PROXY_MATRIX must not be emptied here.
        # Cost is about a second per entry — replay only, seeds only, no
        # mutation budget — against a job that already spends 2 x 9 x 600.
        # What it cannot see: a defect needing both a non-default configuration
        # and a program no seed contains.  FUZZ_MATRIX_SECONDS turns an entry
        # into a mutation run for a manual dig.
        env:
          FUZZ_SEED: ${{ github.run_number }}
          FUZZ_SMUGGLING: "1"
          REQUIRE_LIBFUZZER: "1"
          FUZZ_PROXY_SKIP: ""
        run: bash test/fuzz/run_fuzz.sh "${{ github.event.inputs.fuzz_seconds || 600 }}" Sanitize
        timeout-minutes: 60

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bin/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-fuzz-reproducers
          path: bin/fuzz-artifacts/
          if-no-files-found: warn
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # The invariants build.
  #
  # socketley/shared/invariants.h states the two properties every defect of the
  # family this project keeps hitting violates: a connection pair with nothing
  # in flight will never be woken again, and a struct returned to a pool while
  # the ring can still name it will be charged someone else's completion.  The
  # checks compile to nothing unless SOCKETLEY_INVARIANTS is defined, and they
  # reported nothing on their first hot run — which is not evidence that the
  # invariants hold, only that that one run did not violate them.  Load is what
  # makes them earn their keep, so they run here under the churn and restart
  # harnesses rather than only under the integration suite.
  #
  # WARN_ONLY: a violation prints and the process carries on, so one violation
  # does not mask everything after it.  The consequence is that a violation
  # leaves no trace in any exit code — so both the suite wrapper and the step
  # below grep the logs for it explicitly.  That grep is the whole point of this
  # job; without it the job is decoration.
  # ───────────────────────────────────────────────────────────────────────────
  invariants:
    name: Invariants (warn-only) under load
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      - name: Build (Debug + invariants, warn-only)
        # The generated makefiles pass $(CPPFLAGS) through, which is how
        # invariants.h documents turning itself on — no build system change.
        run: |
          ./bin/premake5 gmake2
          cd make
          make config=debug_x64 -j"$(nproc)" \
            CPPFLAGS="-DSOCKETLEY_INVARIANTS -DSOCKETLEY_INVARIANTS_WARN_ONLY"

      - name: Verify the invariants really are compiled in
        # Without this the job is worthless: a CPPFLAGS that did not reach the
        # compiler produces a binary with every check compiled out, which runs
        # the whole suite and reports nothing — indistinguishable from a run
        # where the invariants held.
        run: |
          test -x bin/Debug/socketley || { echo "no bin/Debug/socketley"; exit 1; }
          if ! strings bin/Debug/socketley | grep -q 'nothing in flight on either half'; then
            echo "The invariant messages are not in the binary: SOCKETLEY_INVARIANTS did not reach the compiler."
            echo "This job would have reported success while checking nothing."
            exit 1
          fi
          echo "Invariant checks are compiled in."

      - name: Integration suite (invariants warn-only)
        env:
          SOCKETLEY_CONFIG: Debug
        run: bash test/ci/assert_suite.sh suite-invariants.log
        timeout-minutes: 15

      - name: Load harnesses (invariants warn-only)
        # The lifecycle harnesses only — the three measure_* ones exist to
        # produce comparable timings and there is nothing to compare an
        # invariants build against.  These three are the ones that churn
        # connections and runtimes, which is what the invariants watch.
        env:
          SOCKETLEY_CONFIG: Debug
          LOAD_SETTLE_SECS: "20"
        run: |
          set -o pipefail
          bash test/load/run_all.sh restart_under_load runtime_churn_leak churn_repro \
            2>&1 | tee load-invariants.log
        timeout-minutes: 35

      - name: Fail on any invariant violation
        # WARN_ONLY means a violation cannot fail a process, so it has to fail
        # here or it fails nowhere.
        if: always()
        run: |
          found=0
          for f in suite-invariants.log load-invariants.log; do
            [ -f "$f" ] || continue
            if grep -q '\[invariant\]' "$f"; then
              echo "=== invariant violations in $f ==="
              grep -n '\[invariant\]' "$f" | head -40
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo
            echo "An invariant stated in socketley/shared/invariants.h was violated."
            echo "These are not warnings: each one is a connection that will never be woken"
            echo "again, or a completion charged to the wrong connection."
            exit 1
          fi
          echo "No invariant violations."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-invariants-logs
          path: |
            suite-invariants.log
            load-invariants.log
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # The calibrated load harnesses, against a Release build.
  #
  # These are the ones with the 60 s settle, the pinned cores and the discarded
  # warm-ups.  They belong on a Release build and nowhere else: under ASan the
  # timing changes by several times over, which makes the numbers incomparable
  # with every measurement taken on the development machine — and comparability
  # is the entire design of these harnesses.
  #
  # The runner has four cores, so pinning is available; if a future runner image
  # has fewer, the harnesses say so loudly in their own output rather than
  # quietly producing numbers that look like the pinned ones.
  # ───────────────────────────────────────────────────────────────────────────
  load:
    name: Load harnesses (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      - name: Build (Release)
        run: |
          ./bin/premake5 gmake2
          cd make && make config=release_x64 -j"$(nproc)"
          cd ..
          test -x bin/Release/socketley || { echo "no bin/Release/socketley"; exit 1; }
          test -x bin/Release/socketley_bench || { echo "no bin/Release/socketley_bench"; exit 1; }

      - name: Report the measurement environment
        # Recorded so a surprising result can be read against the machine it was
        # produced on rather than guessed at afterwards.
        run: |
          echo "cores:  $(nproc)"
          echo "cpu:    $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "memory: $(free -m | awk '/^Mem:/{print $2 " MB"}')"
          echo "kernel: $(uname -r)"
          echo "load:   $(cat /proc/loadavg)"

      - name: Load harnesses
        run: |
          set -o pipefail
          bash test/load/run_all.sh 2>&1 | tee load-release.log
        timeout-minutes: 100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-load-log
          path: load-release.log
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # TSan.
  #
  # Expected to be quiet.  The event loop is single-threaded — one io_uring, one
  # thread, every handler on it — so there is nothing for TSan to find today and
  # a green run here proves almost nothing about correctness.  It proves the
  # configuration builds, links and runs the suite, which is the whole point of
  # standing it up now: the project is heading for one process per runtime and
  # threads after that, and the day the first structure crosses a thread
  # boundary is a bad day to also discover that the TSan build does not work.
  #
  # If TSan reports something before that work lands, it is a real finding —
  # most likely a signal handler or an atomic used across the daemon's fork —
  # and not noise to be suppressed.
  # ───────────────────────────────────────────────────────────────────────────
  tsan:
    name: TSan (expected quiet)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      - name: Build (TSan)
        run: |
          ./bin/premake5 gmake2
          cd make && make config=tsan_x64 -j"$(nproc)"
          cd ..
          test -x bin/TSan/socketley || { echo "no bin/TSan/socketley"; exit 1; }
          if ! nm -C bin/TSan/socketley 2>/dev/null | grep -q '__tsan_'; then
            echo "bin/TSan/socketley has no TSan symbols — it was not built with -fsanitize=thread."
            exit 1
          fi
          echo "TSan symbols present."

      - name: Integration suite (TSan)
        env:
          SOCKETLEY_CONFIG: TSan
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:log_path=stderr
        run: bash test/ci/assert_suite.sh suite-tsan.log
        timeout-minutes: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-tsan-log
          path: suite-tsan.log
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Release/LTO compile smoke.  Per-push CI no longer builds Release, so without
  # this a change that only breaks under -flto, -D_FORTIFY_SOURCE=2 or
  # -fvisibility=hidden would not surface until a release tag.  Build only: the
  # tests that matter run in the other jobs.
  # ───────────────────────────────────────────────────────────────────────────
  release-lto:
    name: Release/LTO build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
          luajit_a="$(find /usr/lib -name 'libluajit-5.1.a' | head -1)"
          test -n "$luajit_a" || { echo "libluajit-5.1.a not found"; exit 1; }
          cp "$luajit_a" thirdparty/luajit/libluajit.a
          bash scripts/install-liburing.sh

      - name: Build (Release) and fail on any warning
        # The project's build contract is zero warnings under -Wall -Wextra.
        # A warning that only appears under LTO or -D_FORTIFY_SOURCE=2 appears
        # nowhere else in this pipeline.
        run: |
          ./bin/premake5 gmake2
          cd make
          set -o pipefail
          make config=release_x64 -j"$(nproc)" 2>&1 | tee ../release-build.log
          cd ..
          if grep -E 'warning:|error:' release-build.log; then
            echo
            echo "The Release build is not warning-clean.  That is a build contract violation."
            exit 1
          fi
          test -x bin/Release/socketley || { echo "no bin/Release/socketley"; exit 1; }
          echo "Release build clean."

      - name: Unit tests (Release)
        run: |
          set -e
          for t in test_command_hashing test_cache_store test_resp_parser \
                   test_name_resolver test_ws_parser; do
            echo "--- $t ---"
            ./bin/Release/"$t"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-release-build-log
          path: release-build.log
          if-no-files-found: warn
          retention-days: 14
